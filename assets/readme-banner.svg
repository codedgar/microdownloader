<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1280 360" width="1280" height="360"
     role="img" aria-label="Microdownloader: a minimal, signed yt-dlp GUI for macOS">

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1c20"/>
      <stop offset="100%" stop-color="#101216"/>
    </linearGradient>

    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8C32" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF8C32" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF8C32" stop-opacity="0"/>
    </linearGradient>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background surface -->
  <rect width="1280" height="360" fill="url(#surface)"/>

  <!-- subtle vertical hairline grid for hardware feel -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="640" y1="0" x2="640" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
  </g>

  <!-- top + bottom accent hairlines -->
  <rect x="0" y="0" width="1280" height="1" fill="url(#hairline)"/>
  <rect x="0" y="359" width="1280" height="1" fill="url(#hairline)"/>

  <!-- app icon, left side -->
  <image x="80" y="60" width="240" height="240"
         xlink:href="app-icon.png"
         filter="url(#iconShadow)"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- text block -->
  <g font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace">

    <!-- micro-label / eyebrow -->
    <text x="380" y="138"
          font-size="14" font-weight="500"
          letter-spacing="4"
          fill="#FF8C32"
          text-transform="uppercase">
      MACOS · YT-DLP · MIT
    </text>

    <!-- product name -->
    <text x="380" y="200"
          font-size="64" font-weight="600"
          letter-spacing="-1"
          fill="#f4f4f5">
      microdownloader
    </text>

    <!-- subheading -->
    <text x="380" y="244"
          font-size="22" font-weight="400"
          fill="#a1a1aa">
      A minimal, signed yt-dlp GUI for macOS.
    </text>

    <!-- tertiary line -->
    <text x="380" y="280"
          font-size="16" font-weight="400"
          fill="#71717a">
      Paste a URL. Pick Auto / Video / Audio. Download.
    </text>

  </g>

  <!-- right-side LED-style version chip -->
  <g transform="translate(1080,140)">
    <rect x="0" y="0" width="120" height="80" rx="8"
          fill="#0a0b0d" stroke="#2a2c30" stroke-width="1"/>
    <text x="60" y="32"
          font-family="'JetBrains Mono', monospace"
          font-size="10" font-weight="500"
          letter-spacing="2"
          fill="#71717a"
          text-anchor="middle">VERSION</text>
    <text x="60" y="64"
          font-family="'DotGothic16', 'JetBrains Mono', monospace"
          font-size="28" font-weight="400"
          fill="#FF8C32"
          text-anchor="middle">0.1.0</text>
  </g>

</svg>
